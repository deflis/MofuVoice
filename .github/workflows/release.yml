name: Release

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Cache LLVM
        uses: actions/cache@v6
        with:
          path: .tools/llvm
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}

      - name: Cache ASIO SDK
        uses: actions/cache@v6
        with:
          path: .tools/asiosdk
          key: asio-sdk-${{ hashFiles('mise.toml') }}

      - name: Set up LLVM and ASIO SDK
        run: mise run setup:ci

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: mise run check:web

      - name: Build React frontend
        run: mise run build:web

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --features desktop,custom-protocol --locked

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-release
          path: |
            target/release/rust-low-latency-voice-changer-gui.exe
            target/release/rust-low-latency-voice-changer-cli.exe
          if-no-files-found: error
