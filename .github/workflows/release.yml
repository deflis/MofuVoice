name: Release

# Pre-release style portable GUI builds for master.
# Not a tagged/formal release — artifacts only (Windows / macOS).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            platform: windows
            setup_llvm: true
          - os: macos-latest
            artifact: macos-arm64
            platform: macos
            setup_llvm: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Cache LLVM
        if: matrix.setup_llvm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/llvm
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}

      - name: Set up LLVM
        if: matrix.setup_llvm
        run: mise run setup:ci

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.artifact }}

      - name: Build GUI
        run: cargo build --release --features desktop --locked --bin MofuVoice

      - name: Package Windows portable
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/MofuVoice.exe dist/
          cp LICENSE dist/

      - name: Package macOS app, DMG and archive
        if: matrix.platform == 'macos'
        run: bash scripts/package-macos.sh

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
