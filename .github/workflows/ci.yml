name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Cache LLVM
        uses: actions/cache@v6
        with:
          path: .tools/llvm
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}

      - name: Cache ASIO SDK
        uses: actions/cache@v6
        with:
          path: .tools/asiosdk
          key: asio-sdk-${{ hashFiles('mise.toml') }}

      - name: Set up LLVM and ASIO SDK
        run: mise run setup:ci

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check Rust and frontend
        run: mise run check

      - name: cargo test
        run: cargo test --all-features --locked

      - name: cargo test (release spectral_quality)
        run: cargo test --release --locked --test spectral_quality
