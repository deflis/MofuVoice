name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI does not need debugger symbols. Smaller artifacts also reduce Windows
  # linker work and Cargo cache transfer time; release DSP settings stay intact.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Window-quality matrices process hundreds of seconds of audio. Optimize test
  # execution while retaining test-profile debug assertions and overflow checks.
  CARGO_PROFILE_TEST_OPT_LEVEL: "2"
  # Incremental state is not reused by rust-cache across ephemeral runners.
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'src/gui/locales/**'
              - 'scripts/**'
              - 'resources/**'
              - 'Info.plist'
              - 'icons/**'
              - 'mise.toml'
              - '.github/workflows/**'
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Install Linux desktop and audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan-dev clang cmake

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Lint shared core without platform backends
        run: cargo clippy --no-default-features --all-targets --locked -- -D warnings

      - name: Lint CPAL without ASIO or desktop
        run: cargo clippy --no-default-features --features cpal-backend --all-targets --locked -- -D warnings

      - name: GUI state and interaction tests
        run: cargo test --no-default-features --features desktop-tests,cpal-backend --locked --lib gui::

      - name: cargo test
        run: cargo test --all-features --locked

  windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Cache LLVM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/llvm
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}

      - name: Set up LLVM
        run: mise run setup:ci

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check Windows feature integration
        run: cargo check --all-targets --all-features --locked

      - name: Test Windows ASIO backend
        run: "cargo test --no-default-features --features asio --locked --lib asio::"

  portable:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check CPAL without ASIO SDK
        run: cargo clippy --no-default-features --features cpal-backend --all-targets --locked -- -D warnings
      - name: Check CPAL desktop shell
        run: cargo check --no-default-features --features desktop,cpal-backend --all-targets --locked
      - name: Test CPAL and shared DSP
        run: cargo test --no-default-features --features cpal-backend --locked
      - name: Check shared core without ASIO SDK
        run: cargo clippy --no-default-features --all-targets --locked -- -D warnings
      - name: Test portable core
        run: cargo test --no-default-features --locked

  dsp:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dsp-release
      - name: Validate DSP in release mode
        run: cargo test --no-default-features --release --locked
      - name: Measure processing time per window and pitch
        run: cargo bench --no-default-features --locked --bench window_settings
      - name: Measure DSP performance
        run: cargo bench --no-default-features --locked --bench spectral

  # Keep the existing required check available even when jobs are skipped.
  check:
    if: always()
    needs: [changes, rust, windows, portable, dsp]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
