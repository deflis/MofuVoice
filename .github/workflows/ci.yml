name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Cache LLVM
        uses: actions/cache@v6
        with:
          path: .tools/llvm
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}

      - name: Cache ASIO SDK
        uses: actions/cache@v6
        with:
          path: .tools/asiosdk
          key: asio-sdk-${{ hashFiles('mise.toml') }}

      - name: Set up LLVM and ASIO SDK
        run: mise run setup:ci

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check Rust and frontend
        run: mise run check

      - name: Frontend regression tests
        run: pnpm test:web

      - name: cargo test
        run: cargo test --all-features --locked

      - name: cargo test (release spectral_quality)
        run: cargo test --release --locked --test spectral_quality

  portable:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Check CPAL without ASIO SDK
        run: cargo clippy --no-default-features --features cpal-backend --all-targets --locked -- -D warnings
      - name: Check CPAL desktop shell
        run: cargo check --no-default-features --features desktop,cpal-backend --all-targets --locked
      - name: Test CPAL and shared DSP
        run: cargo test --no-default-features --features cpal-backend --release --locked
      - name: Check shared core without ASIO SDK
        run: cargo clippy --no-default-features --all-targets --locked -- -D warnings
      - name: Test portable core
        run: cargo test --no-default-features --locked
      - name: Validate DSP quality
        run: cargo test --no-default-features --release --locked --test spectral_quality
