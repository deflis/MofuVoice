name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'tauri.conf.json'
              - 'capabilities/**'
              - 'icons/**'
              - 'mise.toml'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.npmrc'
              - 'pnpm-workspace.yaml'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - 'tauri.conf.json'
              - 'capabilities/**'
              - 'mise.toml'
              - '.github/workflows/**'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: "26.11.1"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend formatting
        run: pnpm exec oxfmt --check frontend package.json tauri.conf.json capabilities .oxlintrc.json .oxfmtrc.json .github/workflows
      - name: Lint frontend
        run: pnpm exec oxlint --deny-warnings frontend
      - name: Check frontend types
        run: pnpm exec tsc -p frontend/tsconfig.json
      - name: Frontend regression tests
        run: pnpm test:web
      - name: Build React frontend
        run: pnpm build

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Install Linux desktop and audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v6
        with:
          node-version: "26.11.1"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --check

      # All-feature clippy enables Tauri, which needs the built frontend assets.
      - name: Build React frontend for Tauri
        run: mise run build:web

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Lint shared core without platform backends
        run: cargo clippy --no-default-features --all-targets --locked -- -D warnings

      - name: Lint CPAL without ASIO or desktop
        run: cargo clippy --no-default-features --features cpal-backend --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --all-features --locked

  windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Cache LLVM
        uses: actions/cache@v6
        with:
          path: .tools/llvm
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}

      - name: Cache ASIO SDK
        uses: actions/cache@v6
        with:
          path: .tools/asiosdk
          key: asio-sdk-${{ hashFiles('mise.toml') }}

      - name: Set up LLVM and ASIO SDK
        run: mise run setup:ci

      - uses: actions/setup-node@v6
        with:
          node-version: "26.11.1"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # The desktop feature needs the built frontend assets.
      - name: Build React frontend for Tauri
        run: mise run build:web

      - name: Check Windows feature integration
        run: cargo check --all-targets --all-features --locked

      - name: Test Windows ASIO backend
        run: "cargo test --no-default-features --features asio --locked --lib asio::"

      - name: Test Windows native spectrum
        run: cargo test --no-default-features --locked --test native_spectrum

  portable:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check CPAL without ASIO SDK
        run: cargo clippy --no-default-features --features cpal-backend --all-targets --locked -- -D warnings
      - name: Check CPAL desktop shell
        run: cargo check --no-default-features --features desktop,cpal-backend --all-targets --locked
      - name: Test CPAL and shared DSP
        run: cargo test --no-default-features --features cpal-backend --locked
      - name: Check shared core without ASIO SDK
        run: cargo clippy --no-default-features --all-targets --locked -- -D warnings
      - name: Test portable core
        run: cargo test --no-default-features --locked

  dsp:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dsp-release
      - name: Validate DSP in release mode
        run: cargo test --no-default-features --release --locked
      - name: Measure DSP performance
        run: cargo bench --no-default-features --locked --bench spectral

  # Keep the existing required check available even when jobs are skipped.
  check:
    if: always()
    needs: [changes, frontend, rust, windows, portable, dsp]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
