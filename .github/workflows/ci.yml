name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20"

      - name: Set LIBCLANG_PATH
        shell: pwsh
        run: |
          if (-not $env:LLVM_PATH) { throw 'LLVM_PATH was not set by install-llvm-action' }
          "LIBCLANG_PATH=$($env:LLVM_PATH)\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache ASIO SDK
        uses: actions/cache@v4
        with:
          path: .tools/asiosdk
          key: asio-sdk-${{ hashFiles('scripts/fetch-asio-sdk.ps1') }}

      - name: Fetch ASIO SDK
        shell: pwsh
        run: ./scripts/fetch-asio-sdk.ps1

      - uses: jdx/mise-action@v5

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build React frontend
        run: mise run build:web

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo test --all-features --locked

      - name: cargo test (release spectral_quality)
        run: cargo test --release --locked --test spectral_quality
