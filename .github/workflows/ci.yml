name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI does not need debugger symbols. Smaller artifacts also reduce Windows
  # linker work and Cargo cache transfer time; release DSP settings stay intact.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Window-quality matrices process hundreds of seconds of audio. Optimize test
  # execution while retaining test-profile debug assertions and overflow checks.
  CARGO_PROFILE_TEST_OPT_LEVEL: "2"
  # Incremental state is not reused by rust-cache across ephemeral runners.
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'tauri.conf.json'
              - 'capabilities/**'
              - 'icons/**'
              - 'mise.toml'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.npmrc'
              - 'pnpm-workspace.yaml'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - 'tauri.conf.json'
              - 'capabilities/**'
              - 'mise.toml'
              - '.github/workflows/**'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: node pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend formatting
        run: pnpm exec oxfmt --check frontend package.json tauri.conf.json capabilities .oxlintrc.json .oxfmtrc.json .github/workflows
      - name: Lint frontend
        run: pnpm exec oxlint --deny-warnings --ignore-pattern 'frontend/src/**/*.module.css.d.ts' frontend
      - name: Check CSS Module declarations
        run: pnpm check:css
      - name: Check frontend types
        run: pnpm typecheck
      - name: Frontend regression tests
        run: pnpm test:web
      - name: Build React frontend
        run: pnpm build

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Install Linux desktop and audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check Rust formatting
        run: cargo fmt --check

      # All-feature clippy enables Tauri, which needs the built frontend assets.
      - name: Build React frontend for Tauri
        run: mise run build:web

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Lint shared core without platform backends
        run: cargo clippy --no-default-features --all-targets --locked -- -D warnings

      - name: Lint CPAL without ASIO or desktop
        run: cargo clippy --no-default-features --features cpal-backend --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --all-features --locked

  windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Cache LLVM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/llvm
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}

      - name: Set up LLVM
        run: mise run setup:ci

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The desktop feature needs the built frontend assets.
      - name: Build React frontend for Tauri
        run: mise run build:web

      - name: Check Windows feature integration
        run: cargo check --all-targets --all-features --locked

      - name: Test Windows ASIO backend
        run: "cargo test --no-default-features --features asio --locked --lib asio::"

  portable:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check CPAL without ASIO SDK
        run: cargo clippy --no-default-features --features cpal-backend --all-targets --locked -- -D warnings
      - name: Check CPAL desktop shell
        run: cargo check --no-default-features --features desktop,cpal-backend --all-targets --locked
      - name: Test CPAL and shared DSP
        run: cargo test --no-default-features --features cpal-backend --locked
      - name: Check shared core without ASIO SDK
        run: cargo clippy --no-default-features --all-targets --locked -- -D warnings
      - name: Test portable core
        # On Windows this includes tests/native_spectrum.rs, so the ASIO job
        # does not need another no-default-features build to run it separately.
        run: cargo test --no-default-features --locked

  dsp:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dsp-release
      - name: Validate DSP in release mode
        run: cargo test --no-default-features --release --locked
      - name: Measure processing time per window and pitch
        run: cargo bench --no-default-features --locked --bench window_settings
      - name: Measure DSP performance
        run: cargo bench --no-default-features --locked --bench spectral

  # Keep the existing required check available even when jobs are skipped.
  check:
    if: always()
    needs: [changes, frontend, rust, windows, portable, dsp]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
