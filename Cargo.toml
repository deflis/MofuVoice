[package]
name = "mofu-voice"
version = "0.1.0"
edition = "2021"
license = "MIT"
autobins = false
default-run = "MofuVoice"

[[bin]]
name = "mofu-voice-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "MofuVoice"
path = "src/bin/gui.rs"
required-features = ["desktop"]

[features]
default = ["cpal-backend", "asio"]
cpal-backend = ["dep:cpal"]
asio = ["dep:asio-sys"]
custom-protocol = ["desktop", "tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:serde"]

[dependencies]
cpal = { version = "0.18", optional = true }
tauri = { version = "2", optional = true , features = [] }
serde = { version = "1", features = ["derive"], optional = true }
[target.'cfg(windows)'.dependencies]
asio-sys = { version = "=0.2.6", optional = true }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "spectral"
harness = false

[[bench]]
name = "window_settings"
harness = false

[[bench]]
name = "eq"
harness = false

[[bench]]
name = "gate"
harness = false

[[bench]]
name = "deesser"
harness = false

[[bench]]
name = "level"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "limiter"
