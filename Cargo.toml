[package]
name = "mofu-voice"
version = "0.1.0"
edition = "2021"
license = "MIT"
autobins = false
default-run = "MofuVoice"

[[bin]]
name = "mofu-voice-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "MofuVoice"
path = "src/bin/gui.rs"
required-features = ["desktop"]

[features]
default = ["cpal-backend", "asio"]
cpal-backend = ["dep:cpal"]
asio = ["dep:asio-sys"]
desktop = ["dep:gpui-kit", "dep:serde", "dep:serde_json", "dep:sys-locale", "dep:image", "dep:embed-resource"]
desktop-tests = ["desktop", "gpui-kit/test-support"]

[dependencies]
cpal = { version = "0.18", optional = true }
gpui-kit = { version = "=0.9.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sys-locale = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false, optional = true }
[target.'cfg(windows)'.dependencies]
asio-sys = { version = "=0.4.0", optional = true }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(windows)'.build-dependencies]
embed-resource = { version = "3", optional = true }

[[bench]]
name = "spectral"
harness = false

[[bench]]
name = "window_settings"
harness = false

[[bench]]
name = "eq"
harness = false

[[bench]]
name = "gate"
harness = false

[[bench]]
name = "deesser"
harness = false

[[bench]]
name = "level"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "limiter"
