[tools]
rust = { version = "1.99.0", components = ["rustfmt", "clippy"] }
node = "26.11.1"
pnpm = "12.11.2"
"http:asiosdk" = {
  version = "2.3.4",
  url = "https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip",
  checksum = "sha256:d5ebf0c20dd2c5f43771fd0c1418f4b361bf52434ee670097cfa6b3a335e2eca",
  strip_components = 1,
  os = ["windows"],
}
"http:llvm" = {
  version = "23.1.3",
  url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/clang%2Bllvm-23.1.3-x86_64-pc-windows-msvc.tar.xz",
  checksum = "sha256:9ee6a2192fbb30c776415af529927f76ca6b5d1d55699bb1315f9878e610b5b8",
  strip_components = 1,
  os = ["windows"],
}

[env]
CPAL_ASIO_DIR = { value = "{% if tools.asiosdk %}{{ tools.asiosdk.path }}{% endif %}", tools = true }
LIBCLANG_PATH = { value = "{% if tools.llvm %}{{ tools.llvm.path }}/bin{% endif %}", os = ["windows"], tools = true }
PATH = { value = "{% if tools.llvm %}{{ tools.llvm.path }}/bin{% endif %}", prefix = true, os = ["windows"], tools = true }

[tasks.fmt]
description = "Format Rust and frontend files"
depends = ["fmt:rust", "fmt:web"]

[tasks."fmt:rust"]
run = "cargo fmt"

[tasks."fmt:web"]
run = "pnpm exec oxfmt frontend package.json tauri.conf.json capabilities .oxlintrc.json .oxfmtrc.json .github/workflows"

[tasks."fmt:check"]
description = "Check Rust and frontend formatting"
depends = ["fmt:rust:check", "fmt:web:check"]

[tasks."fmt:rust:check"]
run = "cargo fmt --check"

[tasks."fmt:web:check"]
run = "pnpm exec oxfmt --check frontend package.json tauri.conf.json capabilities .oxlintrc.json .oxfmtrc.json .github/workflows"

[tasks.lint]
description = "Lint Rust and frontend code"
depends = ["lint:rust", "lint:web"]

[tasks."lint:rust"]
depends = ["build:web"]
run = "cargo clippy --all-targets --all-features --locked -- -D warnings"

[tasks."lint:web"]
run = "pnpm exec oxlint --deny-warnings frontend"

[tasks.typecheck]
run = "pnpm exec tsc -p frontend/tsconfig.json"

[tasks."build:web"]
depends = ["typecheck"]
run = "pnpm build"

[tasks.check]
description = "Check formatting, lint and types across the project"
depends = ["fmt:check", "lint", "typecheck"]

[tasks."check:web"]
description = "Check frontend formatting, lint and types"
depends = ["fmt:web:check", "lint:web", "typecheck"]

[tasks."setup:ci"]
description = "Install LLVM for GitHub Actions"
depends = ["setup:llvm"]
shell = "pwsh -NoProfile -Command"
run = '''
if ($env:GITHUB_ENV) {
    "LIBCLANG_PATH=$env:LIBCLANG_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    $env:LIBCLANG_PATH | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
}
'''

[tasks."setup:llvm"]
description = "Verify LLVM 23.1.3 and make libclang available on Windows"
shell = "pwsh -NoProfile -Command"
run = '''
$ErrorActionPreference = 'Stop'
if (-not $env:LIBCLANG_PATH) {
    throw 'LIBCLANG_PATH is not configured; run mise install first'
}
if (-not (Test-Path -LiteralPath (Join-Path $env:LIBCLANG_PATH 'libclang.dll') -PathType Leaf)) {
    throw "LLVM installation is missing $env:LIBCLANG_PATH\libclang.dll"
}
& (Join-Path $env:LIBCLANG_PATH 'clang.exe') --version
if ($LASTEXITCODE -ne 0) { throw "clang failed with exit code $LASTEXITCODE" }
'''
